version: 2

models:

  - name: daily_detection
    description: >
      Daily aggregation of NASA FIRMS fire detections by acquisition date,
      province, regency, confidence level, day or night classification,
      and ingestion source.

    columns:

      - name: acquisition_date
        data_type: date
        description: >
          Date on which the fire detections were acquired by NASA FIRMS.
        data_tests:
          - not_null

      - name: province_name
        data_type: string
        description: >
          Name of the province where the fire detections occurred.
        data_tests:
          - not_null

      - name: regency_name
        data_type: string
        description: >
          Name of the regency where the fire detections occurred.
        data_tests:
          - not_null

      - name: confidence_level
        data_type: string
        description: >
          Confidence classification of the fire detections, categorized
          as High, Nominal, Low, or Unknown.
        data_tests:
          - not_null

      - name: day_night
        data_type: string
        description: >
          Indicates whether the fire detections were acquired during
          daytime or nighttime.
        data_tests:
          - not_null

      - name: ingestion_source
        data_type: string
        description: >
          Source of the ingestion pipeline that processed the fire
          detection data, such as batch or streaming.
        data_tests:
          - not_null

      - name: detection_count
        data_type: integer
        description: >
          Total number of fire detection events for the given date,
          regency, confidence level, day or night classification,
          and ingestion source.
        data_tests:
          - not_null

      - name: total_frp
        data_type: float64
        description: >
          Total Fire Radiative Power (FRP) across all fire detection
          events in the aggregation.
        data_tests:
          - not_null

      - name: max_frp
        data_type: float64
        description: >
          Maximum Fire Radiative Power (FRP) recorded among the fire
          detection events in the aggregation.
        data_tests:
          - not_null

      - name: total_brightness
        data_type: float64
        description: >
          Total brightness value across all fire detection events
          in the aggregation.
        data_tests:
          - not_null

      - name: max_brightness
        data_type: float64
        description: >
          Maximum brightness value recorded among the fire detection
          events in the aggregation.
        data_tests:
          - not_null