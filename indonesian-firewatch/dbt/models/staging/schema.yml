version: 2

models:
  - name: stg_detection_batch
    description: >
      Staging model for NASA FIRMS batch fire detection data.
      Standardizes the raw batch source into the common detection schema
      used by the unified detection staging model.

    columns:
      - name: detection_id
        description: >
          Deterministic identifier generated from the attributes
          defining the grain of a NASA FIRMS fire detection.

      - name: ingestion_source
        description: Source through which the fire detection entered the pipeline.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['batch']

  - name: stg_detection_stream
    description: >
      Staging model for NASA FIRMS streaming fire detection data.
      Standardizes the enriched streaming source into the common detection
      schema used by the unified detection staging model.

    columns:

      - name: detection_id
        description: Unique event identifier generated by the streaming source.

      - name: ingestion_source
        description: Source through which the fire detection entered the pipeline.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['stream']

  - name: stg_detection
    description: >
      Unified staging model combining batch and streaming NASA FIRMS fire
      detection records. Valid records continue to downstream transformations,
      while records with an unmatched regency are retained for quarantine.

    columns:
      - name: detection_id
        description: Unique identifier of the fire detection event.
        data_tests:
          - not_null

      - name: latitude
        description: Latitude of the detected fire location in decimal degrees.
        data_tests:
          - not_null

      - name: longitude
        description: Longitude of the detected fire location in decimal degrees.
        data_tests:
          - not_null

      - name: brightness
        description: Brightness temperature of the detected fire pixel.
        data_tests:
          - not_null

      - name: scan
        description: Scan value representing the pixel scan dimension.
        data_tests:
          - not_null

      - name: track
        description: Track value representing the pixel track dimension.
        data_tests:
          - not_null

      - name: acquisition_date
        description: Date when the fire observation was acquired.
        data_tests:
          - not_null

      - name: acquisition_time
        description: Time when the fire observation was acquired.
        data_tests:
          - not_null

      - name: satellite
        description: Satellite that detected the fire.
        data_tests:
          - not_null

      - name: instrument
        description: Satellite instrument used to detect the fire.
        data_tests:
          - not_null

      - name: confidence
        description: Confidence level of the fire detection.
        data_tests:
          - not_null

      - name: version
        description: Version of the processing type when processing the fire detection.
        data_tests:
          - not_null

      - name: brightness_temperature_t31
        description: Brightness temperature from the T31 channel.
        data_tests:
          - not_null

      - name: fire_radiative_power
        description: Fire Radiative Power (FRP) emitted by the detected fire.
        data_tests:
          - not_null

      - name: daynight
        description: Indicates whether the detection was made during daytime or nighttime.
        data_tests:
          - not_null

      - name: detection_type
        description: Numeric classification type of the fire detection.

      - name: regency_id
        description: >
          Id of regency based on latitude and longitude. A value of -999
          indicates that the detection could not be matched to a regency
          and should be handled by the quarantine branch.
        data_tests:
          - not_null

      - name: ingestion_source
        description: Source through which the fire detection entered the pipeline.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['batch', 'stream']

  - name: stg_regency
    description: >
      Staging model for Indonesian regency reference data.
      Standardizes regency and province identifiers and regency names.

    columns:
      - name: regency_id
        description: Id of the regency.
        data_tests:
          - not_null
          - unique

      - name: province_id
        description: Id of the province associated with the regency.
        data_tests:
          - not_null

      - name: regency_name
        description: Name of the regency.

  - name: stg_province
    description: >
      Staging model for Indonesian province reference data.
      Standardizes province identifiers and province names.

    columns:
      - name: province_id
        description: Id of the province.
        data_tests:
          - not_null
          - unique

      - name: province_name
        description: Name of the province.